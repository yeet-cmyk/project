name: Build Plox Bot APK
on:
  push:
    branches: [plox-bot-android-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK and install platform 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PloxBot.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plox-Bot-APK
          path: PloxBot.apk
          if-no-files-found: error
      - name: Publish directly downloadable APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ploxbot-v0.1-alpha PloxBot.apk --target "$GITHUB_SHA" --title "Plox Bot v0.1 alpha" --notes "Android debug-signed APK. Experimental local assistant. No guarantee of wins. Test with caution."